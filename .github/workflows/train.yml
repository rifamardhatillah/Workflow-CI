name: MLflow CI Training Advanced

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT REPOSITORY
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v3

      # =====================================================
      # SETUP CONDA (untuk MLflow environment)
      # =====================================================
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          activate-environment: ""
          use-mamba: true

      # =====================================================
      # INSTALL DEPENDENCIES (NO conda activate error)
      # =====================================================
      - name: Install MLflow and dependencies
        run: |
          pip install mlflow scikit-learn pandas seaborn matplotlib numpy

      # =====================================================
      # RUN MLFLOW PROJECT
      # =====================================================
      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . \
            -P data_path=diabetes_preprocessing.csv \
            --env-manager=local

      # =====================================================
      # UPLOAD ARTEFAK MLFLOW (AGAR MUNCUL DI GITHUB ACTIONS)
      # =====================================================
      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow_artifacts
          path: MLProject/mlruns/**
          if-no-files-found: warn

      # =====================================================
      # GET MODEL PATH TERBARU DARI MLRUNS
      # =====================================================
      - name: Get Latest MLflow Model Path
        id: get_model
        run: |
          model_path=$(find MLProject/mlruns -type d -path "*/artifacts/model" | sort -r | head -n 1)
          echo "model_path=$model_path" >> $GITHUB_OUTPUT
          echo "MODEL PATH FOUND: $model_path"

      # =====================================================
      # ENABLE DOCKER
      # =====================================================
      - name: Enable Docker
        run: |
          sudo systemctl start docker
          docker --version

      # =====================================================
      # LOGIN DOCKER HUB
      # =====================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =====================================================
      # BUILD DOCKER IMAGE VIA MLFLOW
      # =====================================================
      - name: Build Docker Image Using MLflow
        run: |
          mlflow models build-docker \
            -m ${{ steps.get_model.outputs.model_path }} \
            -n diabetes-ml

      # =====================================================
      # TAG DOCKER IMAGE
      # =====================================================
      - name: Tag Docker Image
        run: |
          docker tag diabetes-ml:latest ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-ml:latest

      # =====================================================
      # PUSH DOCKER IMAGE TO DOCKER HUB
      # =====================================================
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-ml:latest
