name: MLflow CI

on:
  push:
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  train-log-and-dockerize:
    runs-on: ubuntu-latest

    steps:

    # --- 1. Checkout repository ---
    - name: Checkout repository
      uses: actions/checkout@v2

    # --- 2. Set up Python ---
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # --- 3. Install dependencies ---
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas numpy seaborn matplotlib

    # --- 4. Run MLflow Project ---
    - name: Run MLflow Project
      run: |
        cd MLProject
        mlflow run . \
          -P test_size=0.2 \
          -P random_state=42 \
          -P data_path=diabetes_preprocessing.csv \
          --env-manager=local

    # --- 5. Commit & push MLflow artifacts ---
    - name: Commit and push MLflow artifacts
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add MLProject/mlruns || echo "Nothing to add"
        git commit -m "Update MLflow artifacts" || echo "Nothing to commit"
        git push || echo "Nothing to push"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # --- 6. Get Latest Model Artifact Path ---
    - name: Get latest MLflow model artifact path
      id: get_model
      run: |
        MODEL_PATH=$(find MLProject/mlruns -type d -path "*/artifacts/model" | sort -r | head -n 1)
        echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV

    # --- 7. Docker Login ---
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

    # --- 8. Build Docker Image ---
    - name: Build Docker image from MLflow model
      run: |
        mlflow models build-docker \
          -m $MODEL_PATH \
          -n mlflow-diabetes-model

    # --- 9. Push Docker Image to Docker Hub ---
    - name: Push Docker Image
      run: |
        docker tag mlflow-diabetes-model:latest \
          ${{ secrets.DOCKER_HUB_USERNAME }}/diabetes-ml:latest

        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/diabetes-ml:latest
