name: MLflow CI Training Advanced

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          activate-environment: ""
          use-mamba: true

      - name: Install MLflow dependencies
        run: |
          pip install mlflow scikit-learn pandas seaborn matplotlib numpy

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . \
            -P data_path=diabetes_preprocessing.csv \
            --env-manager=local

      - name: Get Latest MLflow Model Path
        id: get_model
        run: |
          model_path=$(find MLProject/mlruns/0/models -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          echo "model_path=$model_path/artifacts" >> $GITHUB_OUTPUT
          echo "Found model: $model_path"


      - name: Enable Docker
        run: |
          sudo systemctl start docker
          docker --version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image Using MLflow
        run: |
          mlflow models build-docker \
            -m "${{ steps.get_model.outputs.model_path }}" \
            -n diabetes_ml

      - name: Tag Docker Image
        run: |
          docker tag diabetes_ml:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/diabetes_ml:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/diabetes_ml:latest
