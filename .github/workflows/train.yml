name: MLflow CI Training Advanced

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          activate-environment: ""
          use-mamba: true

      - name: Install MLflow and dependencies
        run: |
          pip install mlflow scikit-learn pandas seaborn matplotlib numpy

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . \
            -P data_path=diabetes_preprocessing.csv \
            --env-manager=local

      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model_artifacts
          path: MLProject/mlruns

      # ==================================================
      # AMBIL MODEL TERBARU DARI MLRUNS (yang paling aman)
      # ==================================================
      - name: Get Latest MLflow Model Path
        id: get_model
        run: |
          model_path=$(find MLProject/mlruns -type d -path "*/artifacts/model" | sort -r | head -n 1)
          echo "model_path=$model_path" >> $GITHUB_OUTPUT
          echo "Model Path: $model_path"

      - name: Enable Docker
        run: |
          sudo systemctl start docker
          docker --version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==========================
      # BUILD DOCKER IMAGE MLflow
      # ==========================
      - name: Build Docker Image Using MLflow
        run: |
          mlflow models build-docker \
            -m ${{ steps.get_model.outputs.model_path }} \
            -n diabetes-ml

      # TAG IMAGE
      - name: Tag Docker Image
        run: |
          docker tag diabetes-ml:latest ${{ secrets.DOCKER_USERNAME }}/diabetes-ml:latest

      # PUSH DOCKER IMAGE KE DOCKERHUB
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/diabetes-ml:latest
