name: MLflow CI

on:
  push:
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  train-log-and-dockerize:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas numpy matplotlib seaborn

    - name: Run MLflow Project
      run: |
        mlflow run MLProject --env-manager=local

    - name: Commit and push MLflow artifacts
      run: |
        git config user.name 'github-actions'
        git config user.email 'github-actions@github.com'
        git add mlruns/*
        git commit -m "Update model artifact from MLflow tracking" || echo "Nothing to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Get latest MLflow model artifact path
      id: get_model_path
      run: |
        MODEL_PATH=$(find mlruns -type d -path "*/artifacts/random_forest_model" | sort -r | head -n 1)
        echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
        echo "Latest model path: $MODEL_PATH"

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: mlflow models build-docker -m $MODEL_PATH -n diabetes-ml

    - name: Push Docker image
      run: |
        docker tag diabetes-ml:latest ${{ secrets.DOCKER_HUB_USERNAME }}/diabetes-ml:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/diabetes-ml:latest
